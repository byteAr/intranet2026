services:

  # ── Servicios solo de dev ────────────────────────────────────────────────────

  postgres:
    ports:
      - '5432:5432'        # expuesto al host para conectar con cliente SQL local

  openldap:
    environment:
      LDAP_ORGANISATION: 'IUGNA Dev'
      LDAP_DOMAIN: 'iugnad.lan'
      LDAP_ADMIN_PASSWORD: 'admin_password'
      LDAP_CONFIG_PASSWORD: 'config_password'
      LDAP_READONLY_USER: 'false'
      LDAP_TLS: 'false'

  phpldapadmin:
    profiles: []            # habilitar en dev (estaba deshabilitado en prod)

  # ── Deshabilitar servicios que requieren infraestructura real ────────────────

  ad-bridge:
    profiles: ['disabled']  # no arranca en dev — no hay AD/Kerberos local

  # ── Backend ─────────────────────────────────────────────────────────────────

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: 'true'
      # Apuntar al OpenLDAP local en vez del AD de producción
      LDAP_URL: ldap://openldap:389
      LDAP_BIND_DN: cn=admin,dc=iugnad,dc=lan
      LDAP_BIND_CREDENTIALS: admin_password
      LDAP_SEARCH_BASE: dc=iugnad,dc=lan
      LDAP_SEARCH_FILTER: (uid={{username}})
      # Deshabilitar bridges externos (no disponibles en local)
      AD_BRIDGE_URL: ''
      MAIL_BRIDGE_URL: ''
      FRONTEND_URL: 'http://localhost:4200'
    ports:
      - '${APP_PORT:-3000}:3000'
    depends_on: !reset      # reemplaza el depends_on del base (quita ad-bridge)
      postgres:
        condition: service_healthy
      openldap:
        condition: service_started
    volumes:
      - ./backend/src:/app/src
      - ./storage/attachments:/app/storage/attachments
      - ./storage/pst:/app/storage/pst
      - ./storage/draft-attachments:/app/storage/draft-attachments

  # ── Frontend con hot reload ──────────────────────────────────────────────────

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    ports:
      - '4200:4200'
    command: >
      npm start --
      --host 0.0.0.0
      --poll 2000
      --proxy-config proxy.conf.docker.js
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
