services:
  postgres:
    ports:
      - '127.0.0.1:5442:5432'
    volumes:
      - ./postgres.conf:/etc/postgresql/postgresql.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf

  redis:
    ports: !reset []

  openldap:
    ports: !reset []

  phpldapadmin:
    profiles: ["disabled"]

  ad-bridge:
    build: ./linux-ad-bridge
    container_name: intranet_ad_bridge
    environment:
      AD_PASS: ${LDAP_BIND_CREDENTIALS}
      KRB5_REALM: ${KRB5_REALM:-IUGNAD.LAN}
      AD_BASE_DN: ${AD_BASE_DN:-DC=iugnad,DC=lan}
      AD_USERS_OU: ${AD_USERS_OU:-CN=Users,DC=iugnad,DC=lan}
      AD_DOMAIN_FQDN: ${AD_DOMAIN_FQDN:-iugnad.lan}
      AD_BIND_DN: ${LDAP_BIND_DN}
    restart: unless-stopped

  backend:
    ports:
      - '127.0.0.1:3001:3000'
    depends_on:
      - ad-bridge
      - redis
    volumes:
      - ./secrets:/run/secrets:ro

  frontend:
    ports:
      - '8280:80'

networks:
  default:
    ipam:
      config:
        - subnet: 192.168.200.0/24
