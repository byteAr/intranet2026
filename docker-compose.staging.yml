# Stack de staging — se ejecuta en paralelo a producción
# Uso: docker compose -p intranet_staging -f docker-compose.staging.yml up -d --build
# Acceso: http://10.98.40.24:8281
#
# Comparte la base de datos de producción (solo lectura de correos y datos reales).
# JWT separado: las sesiones de staging no son válidas en producción y viceversa.

services:
  redis:
    image: redis:7-alpine
    container_name: intranet_staging_redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  ad-bridge:
    build: ./linux-ad-bridge
    container_name: intranet_staging_ad_bridge
    environment:
      AD_HOST: ${AD_HOST:-10.98.40.1}
      AD_USER: ${AD_USER:-svc-pac}
      AD_DOMAIN: ${AD_DOMAIN:-IUGNAD}
      AD_BASE_DN: ${AD_BASE_DN:-DC=iugnad,DC=lan}
      AD_USERS_OU: ${AD_USERS_OU:-CN=Users,DC=iugnad,DC=lan}
      AD_DOMAIN_FQDN: ${AD_DOMAIN_FQDN:-iugnad.lan}
      AD_BIND_DN: ${LDAP_BIND_DN}
      KRB5_REALM: ${KRB5_REALM:-IUGNAD.LAN}
      AD_PASS: ${LDAP_BIND_CREDENTIALS}
    secrets:
      - bridge_secret
      - ldap_bind_credentials
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Sin nombre ni puerto fijo: durante un pase sin corte (scripts/rollout.sh)
    # conviven dos copias. Se llega a él por nginx (servicio "frontend").
    restart: unless-stopped
    env_file: .env.staging
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      GOOGLE_SERVICE_ACCOUNT_PATH: /run/google/google-workspace-key.json
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1']
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 90s
    depends_on:
      redis:
        condition: service_healthy
      ad-bridge:
        condition: service_started
    volumes:
      - intranet2026_chat_uploads:/app/uploads:ro
      - intranet2026_mail_attachments:/app/storage/attachments:ro
      - intranet2026_mail_pst:/app/storage/pst:ro
      - intranet2026_draft_attachments:/app/storage/draft-attachments:ro
      # Los de producción, solo lectura como los demás (los crea el primer pase de
      # producción con estos volúmenes: hay que hacerlo antes de levantar staging).
      - intranet2026_decrypted_attachments:/app/storage/decrypted-attachments:ro
      - intranet2026_siena_files:/app/storage/siena-files:ro
      # Escaneos: bandeja, cuentas y almacén propios de staging (la base es la
      # de producción: cada ambiente muestra y borra solo los escaneos que tiene).
      - scan_inbox:/app/storage/scan-inbox
      - scan_config:/app/storage/scan-config
      - scans:/app/storage/scans
      # Cuenta de servicio de Google (Workspace + Drive), la misma de producción
      - ./secrets/google-workspace-key.json:/run/google/google-workspace-key.json:ro
    secrets:
      - jwt_secret
      - bridge_secret
      - mail_bridge_secret
      - postgres_password
      - ldap_bind_credentials
      - smtp_pass
    networks:
      - default
      - intranet_shared

  # Bandeja de escaneo para probar en staging. ⚠️ Usa los mismos puertos que la
  # de producción (445, 21, 30000-30009: las impresoras no permiten otro para
  # SMB): solo puede estar prendida una de las dos. Por eso va con perfil:
  #   docker compose -p intranet_staging -f docker-compose.staging.yml --profile escaneos up -d --build scan-inbox
  scan-inbox:
    build: ./scan-inbox
    container_name: intranet_staging_scan_inbox
    profiles: ['escaneos']
    restart: unless-stopped
    environment:
      SCAN_PUBLIC_IP: ${SCAN_PUBLIC_IP:-10.98.40.24}
    ports:
      - '445:445'
      - '21:21'
      - '30000-30009:30000-30009'
    volumes:
      - scan_inbox:/inbox
      - scan_config:/config:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: intranet_staging_frontend
    restart: unless-stopped
    # Mismo nginx.conf que producción (viene en la imagen). 127.0.0.1:3003 es la
    # entrada directa al backend, a través de nginx.
    ports:
      - '8281:80'
      - '127.0.0.1:3003:3000'
    depends_on:
      - backend

volumes:
  intranet2026_chat_uploads:
    external: true
  intranet2026_mail_attachments:
    external: true
  intranet2026_mail_pst:
    external: true
  intranet2026_draft_attachments:
    external: true
  intranet2026_decrypted_attachments:
    external: true
  intranet2026_siena_files:
    external: true
  scan_inbox:
  scan_config:
  scans:

networks:
  default:
    ipam:
      config:
        - subnet: 192.168.201.0/24
  intranet_shared:
    external: true
    name: intranet_shared

secrets:
  jwt_secret:
    file: ./secrets/jwt_secret_staging.txt
  bridge_secret:
    file: ./secrets/bridge_secret.txt
  mail_bridge_secret:
    file: ./secrets/mail_bridge_secret.txt
  postgres_password:
    file: ./secrets/postgres_password.txt
  ldap_bind_credentials:
    file: ./secrets/ldap_bind_credentials.txt
  smtp_pass:
    file: ./secrets/smtp_pass.txt
