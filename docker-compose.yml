services:
  postgres:
    image: postgres:16
    container_name: intranet_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    ports:
      - '127.0.0.1:5442:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    secrets:
      - postgres_password
    networks:
      - default
      - intranet_shared
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: intranet_redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  openldap:
    image: osixia/openldap:latest
    container_name: intranet_openldap
    restart: unless-stopped
    environment:
      LDAP_ORGANISATION: 'Example Corp'
      LDAP_DOMAIN: example.com
      LDAP_ADMIN_PASSWORD: admin_password
      LDAP_CONFIG_PASSWORD: config_password
      LDAP_READONLY_USER: 'false'
      LDAP_TLS: 'false'
    ports:
      - '389:389'
      - '636:636'
    volumes:
      - openldap_data:/var/lib/ldap
      - openldap_config:/etc/ldap/slapd.d

  phpldapadmin:
    image: osixia/phpldapadmin:latest
    container_name: intranet_phpldapadmin
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: openldap
      PHPLDAPADMIN_HTTPS: 'false'
    ports:
      - '8090:80'
    depends_on:
      - openldap

  ad-bridge:
    build:
      context: ./linux-ad-bridge
      dockerfile: Dockerfile
    container_name: intranet_ad_bridge
    environment:
      AD_HOST: ${AD_HOST:-10.98.40.22}
      AD_USER: ${AD_USER:-svc-pac}
      AD_DOMAIN: ${AD_DOMAIN:-IUGNAD}
      AD_BASE_DN: ${AD_BASE_DN:-DC=iugnad,DC=lan}
      AD_USERS_OU: ${AD_USERS_OU:-CN=Users,DC=iugnad,DC=lan}
      AD_DOMAIN_FQDN: ${AD_DOMAIN_FQDN:-iugnad.lan}
      AD_BIND_DN: ${LDAP_BIND_DN}
    secrets:
      - bridge_secret
      - ldap_bind_credentials
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: intranet_backend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV}
      REDIS_URL: redis://redis:6379
    ports:
      - '${APP_PORT}:${APP_PORT}'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      openldap:
        condition: service_started
      ad-bridge:
        condition: service_started
    volumes:
      - ./backend/src:/app/src
      - chat_uploads:/app/uploads
      - mail_attachments:/app/storage/attachments
      - mail_pst:/app/storage/pst
      - draft_attachments:/app/storage/draft-attachments
    secrets:
      - jwt_secret
      - bridge_secret
      - mail_bridge_secret
      - postgres_password
      - ldap_bind_credentials
      - smtp_pass

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: intranet_frontend
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src

volumes:
  postgres_data:
  openldap_data:
  openldap_config:
  chat_uploads:
  mail_attachments:
  mail_pst:
  draft_attachments:

networks:
  intranet_shared:
    name: intranet_shared
    driver: bridge

secrets:
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  bridge_secret:
    file: ./secrets/bridge_secret.txt
  mail_bridge_secret:
    file: ./secrets/mail_bridge_secret.txt
  postgres_password:
    file: ./secrets/postgres_password.txt
  ldap_bind_credentials:
    file: ./secrets/ldap_bind_credentials.txt
  smtp_pass:
    file: ./secrets/smtp_pass.txt
