# El backend se busca por su nombre de servicio en el DNS de Docker en cada
# pedido (resolver + variable), no una sola vez al arrancar: así, en un pase
# sin corte (scripts/rollout.sh), nginx se entera de que apareció el backend
# nuevo y de que se fue el viejo. Si una copia no responde, prueba la otra
# (proxy_next_upstream), y si no hay ninguna, muestra la página de mantenimiento.
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 3s;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  set $backend http://backend:3000;

  # index.html — never cache so browser always gets latest chunk references
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    expires 0;
    try_files $uri =404;
  }

  # Serve Angular SPA — fallback all routes to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Página de mantenimiento para errores de backend caído
  error_page 502 503 504 /maintenance.html;
  location = /maintenance.html {
    internal;
    try_files $uri =404;
  }

  # Allow large bodies (PST imports can be several GB)
  client_max_body_size 0;

  # Proxy /api to backend (^~ takes priority over regex location rules below)
  location ^~ /api/ {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_next_upstream error timeout;
    proxy_read_timeout 7200s;
    proxy_send_timeout 7200s;
    proxy_request_buffering off;
  }

  # Proxy Socket.io (chat WebSocket)
  location /socket.io/ {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 3s;
    proxy_next_upstream error timeout;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # ES modules (.mjs) — must appear before the general static rule
  location ~* \.mjs$ {
    default_type application/javascript;
    try_files $uri =404;
  }

  # Cache static assets
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Security headers
  add_header X-Frame-Options "SAMEORIGIN";
  add_header X-Content-Type-Options "nosniff";
  add_header X-XSS-Protection "1; mode=block";
}

# Entrada directa al backend (puerto 3000 del servidor): la usa el mail-bridge
# (http://10.98.40.24:3000/api/mail/bridge/ingest) y los scripts de importación.
# Antes el backend publicaba ese puerto; con dos copias durante un pase no se
# puede, así que entra por acá y sigue al backend que esté vivo.
server {
  listen 3000;
  server_name _;

  set $backend http://backend:3000;
  client_max_body_size 0;

  location / {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_next_upstream error timeout;
    proxy_read_timeout 7200s;
    proxy_send_timeout 7200s;
    proxy_request_buffering off;
  }
}
