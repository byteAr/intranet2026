[global]
   server role = standalone server
   workgroup = WORKGROUP
   server string = Escaneos intranet
   security = user
   map to guest = never
   # Nada de SMB1: las impresoras viejas van por FTP.
   server min protocol = SMB2_02
   disable netbios = yes
   smb ports = 445
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   # La intranet borra lo que toma: todo con permisos abiertos dentro de la bandeja.
   create mask = 0666
   force create mode = 0666
   directory mask = 0777
   force directory mode = 0777
   # Una sección [escaneo-<oficina>] por oficina; la genera entrypoint.sh.
   include = /etc/samba/shares.conf
