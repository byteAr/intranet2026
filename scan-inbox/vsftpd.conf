listen=YES
listen_ipv6=NO
background=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=000
file_open_mode=0666
# Cada usuario de oficina queda encerrado en su carpeta de la bandeja.
chroot_local_user=YES
allow_writeable_chroot=YES
secure_chroot_dir=/var/run/vsftpd/empty
pam_service_name=vsftpd
seccomp_sandbox=NO
pasv_enable=YES
pasv_min_port=30000
pasv_max_port=30009
pasv_addr_resolve=NO
xferlog_enable=YES
# No puede escribir en /dev/stdout ("500 OOPS"): entrypoint.sh muestra este archivo en el log del contenedor.
vsftpd_log_file=/var/log/vsftpd.log
# pasv_address (la IP de la VM) la agrega entrypoint.sh con SCAN_PUBLIC_IP.
